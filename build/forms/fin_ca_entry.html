<form role="form">
<div class="well well-sm" id="mx-show-fin_ca_entry"><strong>Site data</strong><table class="table table-condensed" style="margin:6px 0 0"><tbody></tbody></table></div>
<div class="form-group"><label class="control-label" for="caCode">CA code</label><input type="text" class="form-control" cam-variable-name="caCode" name="caCode" id="caCode" cam-variable-type="String" required></div>
<div class="checkbox"><label><input type="checkbox" cam-variable-name="kycDone" name="kycDone" id="kycDone" cam-variable-type="Boolean"> KYC complete</label></div>
<div class="form-group"><label class="control-label" for="caAmount">Amount (INR)</label><input type="number" step="any" class="form-control" cam-variable-name="caAmount" name="caAmount" id="caAmount" cam-variable-type="Double" required></div>
<div class="form-group"><label class="control-label" for="kycFile">KYC documents</label><input type="file" class="form-control" cam-variable-name="kycFile" name="kycFile" id="kycFile" cam-variable-type="File" cam-max-filesize="10000000"></div>
<script cam-script type="text/form-script">
(function () {
  var SHOW = [["initiator", "Created by"], ["siteName", "Site name"], ["city", "City"], ["address", "Address"]], TID = 'fin_ca_entry';
  var api = window.location.pathname.split('/app/')[0] + '/api/engine/engine/default';
  camForm.on('form-loaded', function () { SHOW.forEach(function (s) { camForm.variableManager.fetchVariable(s[0]); }); });
  camForm.on('variables-fetched', function () {
    var body = document.querySelector('#mx-show-' + TID + ' tbody');
    if (!body) { return; }
    body.innerHTML = '';
    SHOW.forEach(function (s) {
      var v = camForm.variableManager.variable(s[0]) || {}, td = document.createElement('td'), tr = document.createElement('tr');
      if (v.type === 'File' || (v.valueInfo && v.valueInfo.filename)) {
        var link = document.createElement('a');
        link.href = api + '/task/' + camForm.taskId + '/variables/' + s[0] + '/data';
        link.textContent = (v.valueInfo && v.valueInfo.filename) || 'download';
        link.target = '_blank';
        td.appendChild(link);
      } else {
        td.textContent = v.value === undefined || v.value === null || v.value === '' ? '-' : (v.value === true ? 'Yes' : v.value === false ? 'No' : String(v.value));
      }
      var th = document.createElement('th');
      th.textContent = s[1];
      th.style.width = '40%';
      tr.appendChild(th); tr.appendChild(td); body.appendChild(tr);
    });
  });
})();
</script>
</form>
